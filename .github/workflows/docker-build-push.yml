name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    branches: [main, cinema]
    paths:
      - 'src/**'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  OWNER: mnemchinov

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      # Monolith
      - name: Build and push Monolith
        uses: docker/build-push-action@v5
        with:
          context: ./src/monolith
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/yp_software_architect_sprint2_work1/monolith:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Movies Service
      - name: Build and push Movies Service
        uses: docker/build-push-action@v5
        with:
          context: ./src/microservices/movies
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/yp_software_architect_sprint2_work1/movies-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Events Service
      - name: Build and push Events Service
        uses: docker/build-push-action@v5
        with:
          context: ./src/microservices/events
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/yp_software_architect_sprint2_work1/events-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Proxy Service
      - name: Build and push Proxy Service
        uses: docker/build-push-action@v5
        with:
          context: ./src/microservices/proxy
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/yp_software_architect_sprint2_work1/proxy-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: List pushed images
        run: |
          echo "Images pushed successfully:"
          echo "${{ env.REGISTRY }}/${{ env.OWNER }}/yp_software_architect_sprint2_work1/monolith:${{ github.sha }}"
          echo "${{ env.REGISTRY }}/${{ env.OWNER }}/yp_software_architect_sprint2_work1/movies-service:${{ github.sha }}"
          echo "${{ env.REGISTRY }}/${{ env.OWNER }}/yp_software_architect_sprint2_work1/events-service:${{ github.sha }}"
          echo "${{ env.REGISTRY }}/${{ env.OWNER }}/yp_software_architect_sprint2_work1/proxy-service:${{ github.sha }}"

  api-tests:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./tests/postman
        run: npm install

      - name: Run API tests (requires local services)
        working-directory: ./tests/postman
        run: npm run test:local || echo "Tests skipped - requires local infrastructure"