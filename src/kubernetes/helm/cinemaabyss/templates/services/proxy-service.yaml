{{- if .Values.proxyService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: proxy-service
    {{- include "cinemaabyss.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.proxyService.replicas }}
  selector:
    matchLabels:
      app: proxy-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: proxy-service
    spec:
      containers:
      - name: proxy-service
        image: "{{ .Values.proxyService.image.repository }}:{{ .Values.proxyService.image.tag }}"
        imagePullPolicy: {{ .Values.proxyService.image.pullPolicy }}
        ports:
          - containerPort: 8000
        env:
          - name: PORT
            value: "8000"
          - name: GRADUAL_MIGRATION
            value: {{ .Values.config.gradualMigration | quote }}
          - name: MOVIES_MIGRATION_PERCENT
            value: {{ .Values.config.moviesMigrationPercent | quote }}
        envFrom:
        - configMapRef:
            name: cinemaabyss-config
        resources:
          requests:
            memory: {{ .Values.proxyService.resources.requests.memory }}
            cpu: {{ .Values.proxyService.resources.requests.cpu }}
          limits:
            memory: {{ .Values.proxyService.resources.limits.memory }}
            cpu: {{ .Values.proxyService.resources.limits.cpu }}
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: proxy-service
    {{- include "cinemaabyss.labels" . | nindent 4 }}
spec:
  selector:
    app: proxy-service
  ports:
    - port: {{ .Values.proxyService.service.port }}
      targetPort: {{ .Values.proxyService.service.targetPort }}
  type: {{ .Values.proxyService.service.type }}
{{- end }}