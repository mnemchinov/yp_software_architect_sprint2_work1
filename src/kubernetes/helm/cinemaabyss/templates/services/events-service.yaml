{{- if .Values.eventsService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: events-service
    {{- include "cinemaabyss.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.eventsService.replicas }}
  selector:
    matchLabels:
      app: events-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: events-service
    spec:
      containers:
        - name: events-service
          image: "{{ .Values.eventsService.image.repository }}:{{ .Values.eventsService.image.tag }}"
          imagePullPolicy: {{ .Values.eventsService.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.eventsService.service.targetPort }}
          envFrom:
            - configMapRef:
                name: cinemaabyss-config
            - secretRef:
                name: cinemaabyss-secrets
          env:
            - name: PORT
              value: "{{ .Values.eventsService.service.targetPort }}"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
          resources:
            requests:
              memory: {{ .Values.eventsService.resources.requests.memory }}
              cpu: {{ .Values.eventsService.resources.requests.cpu }}
            limits:
              memory: {{ .Values.eventsService.resources.limits.memory }}
              cpu: {{ .Values.eventsService.resources.limits.cpu }}
          livenessProbe:
            httpGet:
              path: /api/events/health
              port: {{ .Values.eventsService.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/events/health
              port: {{ .Values.eventsService.service.targetPort }}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: events-service
  namespace: {{ .Values.global.namespace }}
  labels:
    app: events-service
    {{- include "cinemaabyss.labels" . | nindent 4 }}
spec:
  selector:
    app: events-service
  ports:
    - port: {{ .Values.eventsService.service.port }}
      targetPort: {{ .Values.eventsService.service.targetPort }}
  type: {{ .Values.eventsService.service.type }}
{{- end }}